<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="https://relevantia.com.br/audience-to-business/img/favicon/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="https://relevantia.com.br/audience-to-business/img/favicon/favicon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://relevantia.com.br/audience-to-business/img/favicon/apple-touch-icon.png">
<title>Inscrição confirmada — Audience to Business</title>
<meta name="description" content="Sua vaga no Audience to Business está garantida. Entre no grupo do WhatsApp da turma.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050300">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Space+Grotesk:wght@400;500&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://relevantia.com.br/audience-to-business/css/base.css?v=202610082053">
<style>
  .ty{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow:hidden;overflow:clip;
    background:radial-gradient(90% 70% at 50% 100%,#2A1E04 0%,#0A0800 55%,#050300 100%)}
  .ty .fg{width:900px;height:900px;left:50%;bottom:-560px;margin-left:-450px;background:radial-gradient(circle,rgba(184,134,11,.35),transparent 65%);animation:glowpulse 7s ease-in-out infinite}
  .ty-top{position:relative;z-index:1;padding:28px 0}
  .ty-top .logo img{height:24px}
  .ty-main{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px 0 72px}
  .ty-in{max-width:640px;margin:0 auto}
  .seal{width:72px;height:72px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:var(--grad-gold);color:#fff;
    box-shadow:0 0 0 10px rgba(232,201,106,.12),0 20px 60px rgba(184,134,11,.45);animation:pop .8s var(--ease) both .1s}
  .seal svg{width:34px;height:34px;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .6s var(--ease) forwards .6s}
  @keyframes pop{from{opacity:0;transform:scale(.6)}}
  @keyframes draw{to{stroke-dashoffset:0}}
  .ty-kicker{margin-top:28px;font-family:var(--f-tech);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-2)}
  .ty h1{margin-top:12px;font-size:clamp(34px,5.2vw,60px);line-height:1.05;letter-spacing:-.03em}
  .ty p.lead{margin:20px auto 0;max-width:500px;font-size:clamp(16px,1.4vw,18px);color:rgba(255,255,255,.72)}
  .ty .btn{margin-top:34px}
  .ty .btn svg{width:20px;height:20px}
  .ty-note{margin-top:16px;font-size:13.5px;color:rgba(255,255,255,.5)}
  .fade{opacity:0;transform:translateY(14px);animation:up .9s var(--ease) forwards;animation-delay:calc(var(--d,0)*120ms + .3s)}
  @keyframes up{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade,.seal,.seal svg{animation:none;opacity:1;transform:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<main class="ty">
  <div class="glow fg" aria-hidden="true"></div>
  <div class="grid-bg" aria-hidden="true"></div>

  <header class="ty-top">
    <div class="wrap"><a href="https://relevantia.com.br/" class="logo" aria-label="Relevantia"><img src="https://relevantia.com.br/audience-to-business/img/logo-relevantia.png" alt="Relevantia" width="845" height="130"></a></div>
  </header>

  <section class="ty-main">
    <div class="wrap ty-in">
      <div class="seal" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <p class="ty-kicker fade" style="--d:1">Audience to Business · Turma 01</p>
      <h1 class="fade" style="--d:2">Inscrição confirmada.</h1>
      <p class="lead fade" style="--d:3">Sua vaga está garantida. Agora entre no grupo do WhatsApp da turma: é por lá que chegam os próximos passos.</p>
      <a class="btn btn-gold btn-lg fade" style="--d:4" href="https://chat.whatsapp.com/D9fOVJx8EvqJutrWrzstRF" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2Zm5.8 14.03c-.25.69-1.44 1.32-1.98 1.37-.51.05-.99.24-3.34-.7-2.83-1.12-4.62-4.02-4.76-4.21-.14-.19-1.13-1.5-1.13-2.87 0-1.36.71-2.03.97-2.31.25-.28.55-.35.73-.35l.53.01c.17.01.4-.06.62.48.24.56.8 1.94.87 2.08.07.14.12.3.02.49-.09.19-.14.3-.28.47l-.42.49c-.14.14-.29.29-.12.57.16.28.73 1.2 1.56 1.94 1.07.96 1.98 1.25 2.26 1.39.28.14.44.12.6-.07.17-.19.7-.82.88-1.1.19-.28.37-.23.63-.14.25.09 1.62.76 1.9.9.28.14.46.21.53.32.07.12.07.66-.18 1.35Z"/></svg>
        Entrar no grupo do WhatsApp
      </a>
    </div>
  </section>
</main>
</body>
</html>
