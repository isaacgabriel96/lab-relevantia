<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab Relevantia</title>
<meta name="description" content="A casa de quem acompanha as lives semanais do Isaac Araújo: lives, dúvidas, Raio X da empresa e anotações com IA.">
<meta name="theme-color" content="#050300">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Space+Grotesk:wght@400;500;600&family=Playfair+Display:ital,wght@1,400;1,500&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/lab.css">
</head>
<body>

<!-- símbolo da marca -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="lg-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C96A"/><stop offset="1" stop-color="#B8860B"/></linearGradient>
    <symbol id="mark" viewBox="0 0 30 30">
      <rect x="20" y="0" width="10" height="10" fill="#8A6608"/>
      <rect x="10" y="10" width="10" height="10" fill="#E8C96A"/>
      <rect x="20" y="10" width="10" height="10" fill="#F2E7C9"/>
      <rect x="0" y="20" width="10" height="10" fill="url(#lg-gold)"/>
      <rect x="10" y="20" width="10" height="10" fill="#F2E7C9"/>
      <rect x="20" y="20" width="10" height="10" fill="url(#lg-gold)"/>
    </symbol>
  </defs>
</svg>

<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/lab.js" defer></script>
</body>
</html>
